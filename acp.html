<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
  <script src="https://kit.fontawesome.com/996973c893.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap" rel="stylesheet" />

  <title>Portfolio</title>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      background: #252525;
      font-family: "Baloo Tamma 2", cursive;
      margin: 0;
      padding: 0;
    }

    .m-heading {
      font-family: "Roboto Slab", serif;
    }

    .text-white {
      color: white;
    }

    .navigation-link {
      border: 2px solid transparent;
    }

    .navigation-link:hover {
      text-decoration: none;
      border-bottom: 2px solid #f5ba09;
      transition: 0.5s ease;
    }

    .main-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: url('abc.png'); /* Ensure this image exists */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>

<body>

  <div class="container navigation pt-3">
    <div class="row">
      <div class="col-6 d-flex justify-content-start align-items-center">
        <i class="fa fa-spinner fa-spin fa-3x fa-fw text-warning pb-3"></i>
        <h5 class="d-inline pl-2 text-white">CODINGAL</h5>
      </div>
      <div class="col-6 pt-2">
        <div class="row text-center p-0 d-flex justify-content-end align-items-center">
          <div class="col-3">
            <a href="#about" class="text-white navigation-link">About</a>
          </div>
          <div class="col-3">
            <a href="#projects" class="text-white navigation-link">Projects</a>
          </div>
          <div class="col-3">
            <a href="#social-media" class="text-white navigation-link">Social Media</a>
          </div>
          <div class="col-3">
            <a href="https://packetcode.github.io/web-development-crash-course/resume-mini-project/" target="_blank"
              class="text-white navigation-link">Resume</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="main-container">
    <h2 class="text-white">Hello, I'm</h2>
    <h1 class="text-warning m-heading">Joy Gupta</h1>
    <h2 class="text-white">Coding Student</h2>
  </div>

  <script>
    function handleContact() {
      var fullName = document.getElementById("fullname").value;
      var email = document.getElementById("email").value;
      var message = document.getElementById("message").value;
      var snackbar = document.getElementById("snackbar");
      var snackbarText = "";
      var snackbarBG = "#28a7e9";

      if ((fullName === "") || (email === "") || (message === "")) {
        snackbarText = `Please enter values for all fields`;
        snackbarBG = "rgb(255, 204, 203)";
      } else {
        snackbar.className = "show";
        snackbarText = `Thanks ${fullName}...Your message has been recorded`;
      }

      snackbar.className = "show";
      snackbar.innerHTML = snackbarText;
      snackbar.style.backgroundColor = snackbarBG;
      setTimeout(function () {
        snackbar.className = snackbar.className.replace("show", "");
      }, 3000);
    }
  </script>
</body>
</html>
